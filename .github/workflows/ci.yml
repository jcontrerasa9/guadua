# En cada push y pull request se corren ruff (linter), pytest (pruebas de Python)
# y las pruebas de JS con node --test (incluido en Node, sin npm).

name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  js:
    # Pruebas del codificador JS (node:test, sin dependencias npm).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Pruebas JS
        run: node --test "tests/js/*.test.mjs"

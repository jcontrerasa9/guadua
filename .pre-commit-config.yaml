# Esta configuración implementa tres capas de protección:
# 1. Calidad del código: Ruff mantiene el código Python limpio y consistente.
# 2. Integridad del proyecto: los hooks generales verifican que los archivos tengan formatos válidos.
# 3. Seguridad: se evita subir accidentalmente archivos .env que puedan contener credenciales.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: ^docs/diseno\.md$
      # Límite de 500 KB, excepto los PDF oficiales que alimentan el RAG (data/fuentes/).
      - id: check-added-large-files
        exclude: ^data/fuentes/.*\.pdf$
      - id: detect-private-key
  - repo: local
    hooks:
      - id: no-env-file
        name: Bloquear archivos .env
        entry: "Nunca se sube .env (usa .env.example)"
        language: fail
        files: (^|/)\.env(\..+)?$
        exclude: (^|/)\.env\.example$

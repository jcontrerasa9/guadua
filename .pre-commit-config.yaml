repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: ^docs/diseno\.md$
      - id: check-added-large-files
      - id: detect-private-key
  - repo: local
    hooks:
      - id: no-env-file
        name: Bloquear archivos .env
        entry: "Nunca se sube .env (usa .env.example)"
        language: fail
        files: (^|/)\.env(\..+)?$
        exclude: (^|/)\.env\.example$

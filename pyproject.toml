[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "guadua"
version = "0.1.0"
description = "SARD: reportes de emergencia distribuidos que funcionan sin Internet"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.162.1",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "msgpack==1.2.4",
    "httpx==0.28.1",
]

[project.optional-dependencies]
# Desarrollo: pip install -e ".[dev]"
dev = [
    "ruff==0.17.4",
    "pytest==9.2.0",
    "pre-commit==4.7.0",
    "guadua[ml]",
    "guadua[agents]",
]
# Clasificador de urgencia (N7). Sin este extra el nodo clasifica solo con reglas.
ml = [
    "scikit-learn==1.9.1",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "threadpoolctl==3.8.0",
]
# Agentes con LLM (N8): el ciclo de herramientas en LangGraph. Sin este extra no hay agente de
# triaje y los casos dudosos quedan "ambiguo, revisar". Los clientes de Gemini y Ollama van
# sobre httpx (ya es dependencia); el LLM se activa con LLM_PROVIDER (ver .env.example).
agents = [
    "langgraph==1.2.20",
    "langgraph-checkpoint==4.3.1",
    "langgraph-prebuilt==1.1.1",
    "langgraph-sdk==0.4.14",
    "langchain-core==1.7.6",
    "langsmith==0.14.17",
]
# Radio VHF (D7): faster-whisper en CPU. Sin este extra (o sin el modelo descargado) los
# clips quedan pendientes y el operador escribe el texto. El modelo se baja una vez:
# python -m guadua.radio descargar-modelo small. av 19 no sirve con faster-whisper 1.2.1.
radio = [
    "faster-whisper==1.2.1",
    "ctranslate2==4.8.5",
    "onnxruntime==1.31.1",
    "av==16.1.0",
    "tokenizers==0.23.3",
    "huggingface_hub==2.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/guadua"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# langsmith (dependencia de LangGraph) trae un plugin de pytest que avisa de APIs viejas.
filterwarnings = ["ignore::DeprecationWarning:langsmith.*"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "guadua"
version = "0.1.0"
description = "SARD: reportes de emergencia distribuidos que funcionan sin Internet"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.162.1",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "msgpack==1.2.4",
    "httpx==0.28.1",
]

[project.optional-dependencies]
# Desarrollo: pip install -e ".[dev]"
dev = [
    "ruff==0.17.4",
    "pytest==9.2.0",
    "pre-commit==4.7.0",
    "guadua[ml]",
]
# Clasificador de urgencia (N7). Sin este extra el nodo clasifica solo con reglas.
ml = [
    "scikit-learn==1.9.1",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "threadpoolctl==3.8.0",
]
# Los demás extras pesados (agents, radio) se agregan, fijados, con la tarea que los necesite.

[tool.hatch.build.targets.wheel]
packages = ["src/guadua"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
